<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resetting Pixora cache</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0d0f; color: #f5f5f5; font: 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <p>Resetting local development cache...</p>
    <script>
      Promise.all([
        'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations().then((registrations) => Promise.all(registrations.map((registration) => registration.unregister()))) : Promise.resolve(),
        'caches' in window ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))) : Promise.resolve(),
      ]).finally(() => window.location.replace('./'))
    </script>
  </body>
</html>
